name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "release/**"

# Cancel redundant PR builds — only the latest commit matters
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs pin ubuntu-24.04: ubuntu-latest moved to 26.04, which Playwright 1.58
# has no Chromium build for. Move the pin deliberately, not by default.
env:
  DOCKERHUB_IMAGE: islamdiaa/arkive

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.17.2

      # Rules are configured in backend/pyproject.toml.
      - name: Run ruff check
        run: cd backend && ruff check .

      - name: Run ruff format check
        run: cd backend && ruff format --check .

      # CHANGELOG.md is the source of the GitHub release notes (release job).
      # On a version tag this also requires the tag's section and version
      # files that match the tag, before any image is built or pushed.
      - name: Check CHANGELOG.md and version files
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python scripts/release.py check --tag "$RELEASE_TAG"

  sast:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: python -m mypy app/ --config-file pyproject.toml
        continue-on-error: true

      - name: Run bandit
        run: python -m bandit -r app/ -c pyproject.toml -ll

  test-backend-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt && pip install -e ".[dev]"

      - name: Run core backend pytest
        timeout-minutes: 10
        run: >
          cd backend && python -m pytest tests/ -n auto --dist worksteal
          -m "not slow and not live"
          -q --tb=short
          --cov=app --cov-report=term-missing --cov-report=xml
          || python -m pytest tests/ -m "not slow and not live" -q --tb=short --last-failed

      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit 2>&1 || true

  test-critical:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt && pip install -e ".[dev]"

      - name: Run critical tests
        timeout-minutes: 5
        run: >
          cd backend && python -m pytest tests/critical/ -v
          -m "not slow and not live"
          --tb=short --strict-markers
          --junitxml=test-results/critical-tests.xml

      - name: Upload critical test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-test-results
          path: backend/test-results/

  test-backend-heavy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt && pip install -e ".[dev]"

      - name: Run heavy backend pytest
        timeout-minutes: 20
        run: >
          cd backend && python -m pytest tests/ -n auto --dist worksteal
          -m "slow and not live"
          -q --tb=short

  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run svelte-check
        run: cd frontend && npm run check

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Audit npm dependencies
        run: cd frontend && npm audit --audit-level=high 2>&1 || true

  test-components:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Sync SvelteKit generated files
        run: cd frontend && npx svelte-kit sync

      - name: Run component tests
        run: cd frontend && npm run test

  # Playwright suite (frontend/tests/e2e). playwright.config.ts starts the
  # FastAPI backend on :8200 (ARKIVE_DEV_MODE=1, throwaway config dir) and the
  # SvelteKit dev server on :5173. Developers run the same suite with
  # `frontend/scripts/e2e.sh --docker`.
  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: frontend/scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/.playwright/report/
            frontend/.playwright/test-results/
          include-hidden-files: true
          retention-days: 14

  build:
    needs: [lint, test-backend-core, test-backend-heavy, test-critical, test-frontend, test-components, frontend-e2e, sast]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # "latest" follows the newest stable version tag only. Pushes to main get
      # "main" and the commit sha; a pre-release tag gets just its version; a
      # fix tagged on an older line (v0.4.1 after v0.5.0) moves neither
      # "latest" nor the major-version tag. This fails closed: `shell: bash`
      # sets pipefail, and tag-info refuses a listing without this tag in it,
      # so a failed ls-remote stops the job instead of reading as "no tags".
      - name: Compare this tag with the existing version tags
        id: release_tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: git ls-remote --tags --refs origin | python3 scripts/release.py tag-info "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ steps.release_tag.outputs.newest_in_major == 'true' }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.latest == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          image-ref: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # On a version tag, once the image is pushed and has passed Trivy, publish
  # the GitHub release with the tag's CHANGELOG.md section as its notes (lint
  # already checked the section exists). A release that already exists, for
  # example one written by hand, is left as it is.
  release:
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare release notes
        id: info
        shell: bash
        run: |
          git ls-remote --tags --refs origin | python3 scripts/release.py tag-info "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.info.outputs.version }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
          LATEST: ${{ steps.info.outputs.latest }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::A release for $GITHUB_REF_NAME already exists; its notes were not changed."
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Arkive $VERSION"
                --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$LATEST")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
